; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_itsybitsy_m4]
platform = atmelsam
board = adafruit_itsybitsy_m4
framework = arduino

board_build.usb_product = DMS
board_vendor = GAA Custom Electronics, LLC

build_flags =
    -DUSE_TINYUSB

lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git
    https://github.com/cmaglie/FlashStorage.git
    https://github.com/adafruit/Adafruit_SPIFlash.git
    https://github.com/adafruit/SdFat.git
    https://github.com/adafruit/Adafruit_DotStar.git
    https://github.com/adafruit/Adafruit_BME280_Library.git
    https://github.com/Seeed-Studio/Seeed_Arduino_RTC.git
    https://github.com/adafruit/Adafruit_INA228.git
    https://github.com/adafruit/Adafruit_INA237_INA238.git
 